name: Deploy to GitHub Pages

# Every push and pull request builds, so a broken branch shows before it reaches
# main; only main deploys (the `deploy` job's condition).
on:
  push:
    paths-ignore:
      - "README.md"
      - "PRODUCT.md"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, never cancelled midway; a branch build is superseded by
# the next push to the same ref.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # AVIF/WebP variants from scripts/images.mjs. Keyed on everything the encode
      # reads (masters, recipe, the feature crops' y), so an unchanged image set
      # skips the encode (~80s cold) and a changed one saves a fresh cache.
      - uses: actions/cache@v4
        with:
          path: public/_img
          key: img-${{ hashFiles('public/img/**', 'public/screens/**', 'scripts/images.mjs', 'src/data/feature-art.json') }}
          restore-keys: img-

      # `astro check` (types in .ts and .astro), then the build, which ends with
      # scripts/seo-check.mjs (the seo-check integration in astro.config.mjs): a
      # type error, or a missing title, canonical, OG card, alt or a broken
      # internal link fails this step, so nothing below it deploys.
      - run: npm run build

      - name: Check legal document completeness
        run: |
          if grep -qE '\[FILL IN ON PUBLISH\]|\[SUPPORT_EMAIL\]' dist/privacy/index.html; then
            echo "::warning title=Privacy policy incomplete::src/PRIVACY_POLICY.md still contains placeholders."
          fi
          if grep -qE '\[FILL IN ON PUBLISH\]|\[SUPPORT_EMAIL\]' dist/terms/index.html; then
            echo "::warning title=Terms of Use incomplete::src/TERMS_OF_USE.md still contains placeholders."
          fi

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
